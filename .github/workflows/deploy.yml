name: Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container image tag (default commit SHA)
        required: false
        type: string

concurrency:
  group: deploy-gcp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PULUMI_STACK: ${{ vars.PULUMI_STACK || 'dev' }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
  # Unlocks encrypted stack config on the GCS backend (not a Pulumi Cloud token).
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  AR_REPO: vibegopher
  IMAGE_NAME: api
  CLOUD_RUN_SERVICE: vibegopher-api

jobs:
  deploy:
    name: Build, pulumi up, sync secrets, migrate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required GitHub configuration
        run: |
          missing=0
          for v in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT CORS_ORIGIN PULUMI_BACKEND_URL; do
            if [ -z "${!v}" ]; then
              echo "Missing repository variable: $v"
              missing=1
            fi
          done
          for s in DATABASE_URL AUTH_SECRET PULUMI_CONFIG_PASSPHRASE; do
            if [ -z "${!s}" ]; then
              echo "Missing repository secret: $s"
              missing=1
            fi
          done
          case "${PULUMI_BACKEND_URL}" in
            gs://*) ;;
            *)
              echo "PULUMI_BACKEND_URL must be a gs:// bucket URL (GCS Pulumi backend)"
              missing=1
              ;;
          esac
          if [ -z "${DATABASE_URL_MIGRATE}" ]; then
            echo "Warning: DATABASE_URL_MIGRATE unset; migrations will use DATABASE_URL (prefer Neon direct host, not -pooler)"
          fi
          exit "$missing"
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_MIGRATE: ${{ secrets.DATABASE_URL_MIGRATE }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry Docker auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: |
            go.sum
            infra/go.sum

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA}"
          fi
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_url=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_url }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Set up Pulumi
        uses: pulumi/actions@v6

      # State lives in GCS (vars.PULUMI_BACKEND_URL); auth is WIF → deploy SA (no Pulumi Cloud token).
      # Sync payloads BEFORE pulumi up so Cloud Run does not boot on REPLACE_ME
      # placeholders (production rejects weak AUTH_SECRET). Secret containers must
      # already exist from local bootstrap (`enableCloudRun=false` once).
      - name: Sync runtime secrets into Secret Manager
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          chmod +x infra/scripts/sync-secrets.sh
          ./infra/scripts/sync-secrets.sh

      - name: Pulumi up
        working-directory: infra
        env:
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          pulumi login "${PULUMI_BACKEND_URL}"
          pulumi stack select "${PULUMI_STACK}"
          pulumi config set gcp:project "${GCP_PROJECT_ID}"
          pulumi config set vibegopher:region "${GCP_REGION}"
          pulumi config set vibegopher:imageTag "${{ steps.meta.outputs.tag }}"
          pulumi config set vibegopher:corsOrigin "${CORS_ORIGIN}"
          # Stack config YAML is gitignored — always re-apply WIF binding in CI
          # or deploy would drop the workload identity pool.
          pulumi config set vibegopher:githubOwner "${GITHUB_REPOSITORY_OWNER}"
          pulumi config set vibegopher:githubRepo "${GITHUB_REPOSITORY#*/}"
          pulumi config set vibegopher:protectSecrets true
          pulumi config set vibegopher:enableCloudRun true
          pulumi up --yes

      - name: Run database migrations (Neon direct URL)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_MIGRATE: ${{ secrets.DATABASE_URL_MIGRATE }}
        run: |
          MIGRATE_URL="${DATABASE_URL_MIGRATE:-$DATABASE_URL}"
          if [ -z "$MIGRATE_URL" ]; then
            echo "DATABASE_URL_MIGRATE or DATABASE_URL is required"
            exit 1
          fi
          case "$MIGRATE_URL" in
            *-pooler*)
              echo "error: migrate URL looks like a Neon pooler endpoint; set DATABASE_URL_MIGRATE to the direct host (session/advisory locks)" >&2
              exit 1
              ;;
          esac
          DATABASE_URL="$MIGRATE_URL" go run ./cmd/migrate up

      - name: Force Cloud Run revision to pick up synced secrets
        run: |
          if gcloud run services describe "${CLOUD_RUN_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" >/dev/null 2>&1; then
            gcloud run services update "${CLOUD_RUN_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --update-env-vars="DEPLOYED_SHA=${GITHUB_SHA}" \
              --quiet
          else
            echo "Cloud Run service not found yet; skipping revision bump"
          fi

      - name: Write deployment summary
        working-directory: infra
        run: |
          {
            echo "## Deployed"
            echo ""
            echo "- Image: \`${{ steps.meta.outputs.image_url }}\`"
            echo "- Stack: \`${PULUMI_STACK}\`"
            echo "- Pulumi backend: \`${PULUMI_BACKEND_URL}\`"
            echo "- Migrations: goose \`up\` via \`DATABASE_URL_MIGRATE\` (direct Neon host)"
            echo "- Cloud Run URI: $(pulumi stack output cloudRunUri)"
            echo "- Secret Manager protected: $(pulumi stack output protectSecrets)"
          } >> "$GITHUB_STEP_SUMMARY"
