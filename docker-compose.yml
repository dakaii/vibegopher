services:
  backend:
    container_name: vibegopher-backend-dev1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      - postgresql-dev
    # development.conf is the default (local Docker Postgres).
    # Optional config/local.conf overrides when present (e.g. Neon).
    # postgresql-dev stays on development.conf only so Neon creds never
    # reconfigure the local Postgres container.
    env_file:
      - path: config/development.conf
        required: true
      - path: config/local.conf
        required: false
    environment:
      PORT: "8080"

  postgresql-dev:
    container_name: vibegopher-postgresql-dev1
    image: postgres:16
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data/
    ports:
      - "5431:5432"
    env_file:
      - config/development.conf

  # One-shot migration runner (golang image; production API image is distroless).
  migrator:
    image: golang:1.24-bookworm
    working_dir: /src
    volumes:
      - .:/src
    env_file:
      - config/development.conf
    environment:
      POSTGRES_HOST: postgresql-dev
      POSTGRES_PORT: "5432"
    depends_on:
      - postgresql-dev
    entrypoint: ["go", "run", "./cmd/migrate"]

volumes:
  postgres_dev_data:
