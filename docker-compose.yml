services:
  backend:
    container_name: vibegopher-backend-dev1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - postgresql-dev
    # development.conf is the default (local Docker Postgres).
    # Optional config/local.conf overrides when present (e.g. Neon).
    # postgresql-dev stays on development.conf only so Neon creds never
    # reconfigure the local Postgres container.
    env_file:
      - path: config/development.conf
        required: true
      - path: config/local.conf
        required: false

  postgresql-dev:
    container_name: vibegopher-postgresql-dev1
    image: postgres:latest
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data/
    ports:
      - "5431:5432"
    env_file:
      - config/development.conf

  atlas-dev:
    image: arigaio/atlas:latest
    volumes:
      - ./atlas.hcl:/work/atlas.hcl
      - ./schema.sql:/work/schema.sql
      - ./atlas-migrations:/work/atlas-migrations
    working_dir: /work
    depends_on:
      - postgresql-dev
    environment:
      - ATLAS_CONFIG_FILE=/work/atlas.hcl

volumes:
  postgres_dev_data:
