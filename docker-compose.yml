services:
  backend:
    container_name: vibegopher-backend-dev1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    # postgresql-dev is on the local-db profile; required: false so Neon/remote
    # users can start backend without bringing up local Postgres.
    depends_on:
      postgresql-dev:
        condition: service_started
        required: false
    # development.conf is the default (local Docker Postgres).
    # Optional config/local.conf overrides when present (e.g. Neon).
    # postgresql-dev stays on development.conf only so Neon creds never
    # reconfigure the local Postgres container.
    # Requires Docker Compose ≥ 2.24 (env_file.path + required: false).
    env_file:
      - path: config/development.conf
        required: true
      - path: config/local.conf
        required: false
    environment:
      PORT: "8080"

  postgresql-dev:
    container_name: vibegopher-postgresql-dev1
    image: postgres:16
    profiles: ["local-db"]
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data/
    ports:
      - "5431:5432"
    env_file:
      - config/development.conf

  # One-shot migration runner (golang image; production API image is distroless).
  migrator:
    image: golang:1.24-bookworm
    working_dir: /src
    volumes:
      - .:/src
    depends_on:
      postgresql-dev:
        condition: service_started
        required: false
    # Same optional local.conf override as backend (Neon migrations).
    env_file:
      - path: config/development.conf
        required: true
      - path: config/local.conf
        required: false
    entrypoint: ["go", "run", "./cmd/migrate"]

volumes:
  postgres_dev_data:
