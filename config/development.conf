# Local Docker Compose defaults only — never put real cloud secrets here.
APP_ENV=development
PORT=8081
AUTH_SECRET=dev-secret-key-change-me
POSTGRES_HOST=postgresql-dev
POSTGRES_DB=vibegopher_development
POSTGRES_USER=postgres
POSTGRES_PASSWORD=postgres
POSTGRES_PORT=5432
POSTGRES_SSLMODE=disable
HASH_COST=14
CORS_ORIGIN=http://localhost:5173

# Critic worker (in-process). Set a real key locally to exercise replies.
CRITIC_WORKER_ENABLED=true
# BOT_WORKER_ENABLED=true  # legacy alias still supported
CLERK_SECRET_KEY=
GEMINI_API_KEY=

# Optional: enable password /api/signup + /api/login for curl/manual API checks.
# Leave false when using the Vue SPA (Clerk).
ENABLE_PASSWORD_AUTH=false
